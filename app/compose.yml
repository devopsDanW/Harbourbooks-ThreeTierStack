services:
  api:
    image: ${DOCKER_IMAGE_NAME}:${TAG}
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "5000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy



