name: CI
on:
  push:
    branches: [main, qa]

permissions:
  id-token: write
  contents: read

jobs:
  call-deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses:
      ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets:
      aws-role-arn: ${{ secrets.AWSROLE_HARBOURBOOKS_GITHUBACTIONS }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

  call-deploy-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    uses:
      ./.github/workflows/deploy.yml
    with:
      environment: qa
    secrets:
      aws-role-arn: ${{ secrets.AWSROLE_HARBOURBOOKS_GITHUBACTIONS_QA }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}


